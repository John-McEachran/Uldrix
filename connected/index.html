<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connected — Uldrix</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #0a0a0a;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      text-align: center;
      padding: 48px 40px;
      max-width: 440px;
    }
    .icon {
      font-size: 48px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      color: #888;
      line-height: 1.6;
    }
    a {
      display: inline-block;
      margin-top: 32px;
      font-size: 13px;
      font-weight: 600;
      color: #0a0a0a;
      background: #f0f0f0;
      padding: 10px 22px;
      border-radius: 8px;
      text-decoration: none;
      transition: opacity 0.15s;
    }
    a:hover { opacity: 0.8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✓</div>
    <h1>Your Google Calendar is now connected to Uldrix!</h1>
    <p>Uldrix can now check your availability and book appointments on your behalf.</p>
    <a href="/">Back to Uldrix</a>
  </div>
</body>
</html>
